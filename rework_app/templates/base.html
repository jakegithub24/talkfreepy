<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}talkfreepy{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <header class="site-header py-2">
      <nav class="container d-flex justify-content-between align-items-center">
        <a class="brand" href="/">talkfreepy</a>
        <div class="d-flex gap-2 align-items-center">
          {% if current_user.is_authenticated %}
            <span class="muted" title="Logged in">{{ current_user.username }}</span>
            <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
          {% else %}
            <span class="text-muted text-end">
              <small>Not logged in</small>
            </span>
          {% endif %}
        </div>
      </nav>
    </header>

    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>

    <footer class="container text-center py-4 small footer-note">
      <div>© talkfreepy — Development prototype</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.js"></script>
  </body>
</html>
