{% extends 'base.html' %}
{% block title %}Welcome - talkfreepy{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4 shadow-sm">
      <h2 class="h4 mb-3 text-light">Welcome to talkfreepy</h2>
      <p class="text-muted small">Secure voice calls over the web — prototype.</p>

      <form id="authForm" class="mt-3" method="post" action="/login">
        <div class="mb-2">
          <label class="form-label visually-hidden" for="username">Username</label>
          <input class="form-control" id="username" name="username" placeholder="Username" required>
        </div>
        <div class="mb-3">
          <label class="form-label visually-hidden" for="password">Password</label>
          <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
        </div>

        <div class="d-grid mb-2">
          <button class="btn btn-primary" id="doLogin" type="submit">Log in</button>
        </div>
        <div class="text-center">
          <small class="text-muted">No account? <a href="#" id="doRegister">Create one</a></small>
        </div>
      </form>

      <div id="registerPanel" class="mt-3 d-none">
        <form id="registerForm" method="post" action="/register">
          <input class="form-control mb-2" name="username" placeholder="Choose a username" required>
          <input class="form-control mb-2" name="password" placeholder="Choose a password" type="password" required>
          <input class="form-control mb-2" name="email" placeholder="Email (optional)">
          <div class="d-grid"><button class="btn btn-success">Create account</button></div>
        </form>
      </div>

    </div>
    <p class="small footer-note text-center mt-3">This is a development prototype.</p>
  </div>
</div>
{% endblock %}
