<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - talkfreepy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body#dashboard {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
        }
        .navbar {
            border-radius: 0 0 1rem 1rem;
            box-shadow: 0 4px 24px 0 rgba(30,60,114,0.15);
        }
        .card {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 1.2rem;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-bottom: 2rem;
        }
        .card-header {
            background: rgba(255,255,255,0.25);
            border-bottom: none;
            border-radius: 1.2rem 1.2rem 0 0;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .form-control, .btn {
            border-radius: 2rem;
        }
        .btn-success, .btn-primary {
            box-shadow: 0 2px 8px 0 rgba(46,204,113,0.12);
            font-weight: 500;
        }
        .btn-danger {
            box-shadow: 0 2px 8px 0 rgba(231,76,60,0.12);
            font-weight: 500;
        }
        .list-group-item {
            background: rgba(255,255,255,0.35);
            border: none;
            border-radius: 1rem !important;
            margin-bottom: 0.5rem;
            box-shadow: 0 1px 4px 0 rgba(30,60,114,0.07);
        }
        .online-indicator {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            background: #bbb;
        }
        .online-indicator.online { background: #2ecc40; }
        .online-indicator.in-call { background: #f1c40f; }
        .online-indicator.offline { background: #e74c3c; }
        .call-modal {
            background: rgba(255,255,255,0.95);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
            padding: 2rem 2.5rem;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1200;
            display: none;
            min-width: 320px;
        }
        .call-modal.active { display: block; animation: fadeIn 0.3s; }
        .overlay.active {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(30,60,114,0.25);
            z-index: 1100;
            display: block;
        }
        .overlay { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%,-60%); }
            to { opacity: 1; transform: translate(-50%,-50%); }
        }
        #toastContainer .toast {
            font-size: 1rem;
            border-radius: 1rem;
            min-width: 260px;
        }
        @media (max-width: 768px) {
            .call-modal { min-width: 90vw; padding: 1.2rem; }
        }
    </style>
</head>
<body id="dashboard">
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand">talkfreepy</span>
            <div class="d-flex gap-2">
                <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
                <button id="deleteAccount" class="btn btn-outline-danger">Delete Account</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Left: Profile & Actions -->
            <div class="col-lg-3">
                <div class="card p-3 mb-3">
                    <div class="d-flex align-items-center">
                        <div class="me-3" style="width:56px;height:56px;border-radius:12px;background:linear-gradient(90deg,#60a5fa,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;">{{ user.username[0]|upper }}</div>
                        <div>
                            <div class="fw-bold">{{ user.username }}</div>
                            <div class="small footer-note">Online status: <span id="meStatus">{{ 'Online' if user.online else 'Offline' }}</span></div>
                        </div>
                    </div>
                    <hr/>
                    <div class="d-grid gap-2">
                        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
                        <button id="deleteAccount" class="btn btn-danger">Delete Account</button>
                    </div>
                </div>

                <div class="card p-3">
                    <h6 class="mb-2">Find users</h6>
                    <input id="searchUser" class="form-control" placeholder="Search by username...">
                    <ul id="searchResults" class="list-group mt-2"></ul>
                </div>
            </div>

            <!-- Right: Contacts and Requests -->
            <div class="col-lg-9">
                <div class="row" id="contactsGrid">
                    <!-- cards inserted dynamically here -->
                </div>

                <div class="card mt-3 p-3">
                    <h6>Pending Requests</h6>
                    <ul id="pendingList" class="list-group mt-2"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
      <div id="toastContainer"></div>
    </div>

    <!-- Global confirmation modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header border-0">
            <h5 class="modal-title">Confirm</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="confirmModalBody">Are you sure?</div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="confirmModalOk" class="btn btn-danger">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Global loading overlay -->
    <div id="globalLoader" style="display:none; position:fixed; inset:0; background:rgba(2,6,23,0.6); z-index:1200; align-items:center; justify-content:center;">
      <div class="spinner-border text-light" role="status" style="width:4rem;height:4rem;"></div>
    </div>

     <!-- Call Modals -->
     <div class="overlay"></div>

    <div id="incomingCallModal" class="call-modal">
        <h5>Incoming Call</h5>
        <p>From: <span id="incomingCaller"></span></p>
        <button id="acceptCall" class="btn btn-success">Accept</button>
        <button id="rejectCall" class="btn btn-danger">Reject</button>
    </div>

    <div id="outgoingCallModal" class="call-modal">
        <h5>Outgoing Call</h5>
        <p id="callStatus"></p>
        <button id="cancelCall" class="btn btn-danger">Cancel</button>
    </div>

    <div id="activeCallModal" class="call-modal">
        <h5>In Call</h5>
        <p>Talking to <span id="activeCallUser"></span></p>
        <button id="endActiveCall" class="btn btn-danger">End Call</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
