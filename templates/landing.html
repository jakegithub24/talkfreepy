<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>talkfreepy - Voice over IP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="hero py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
                    <h1 class="display-5">talkfreepy</h1>
                    <p class="lead">Private, lightweight voice calls for the web — fast and simple.</p>
                    <p class="footer-note">No phone numbers, no ads. Open-source-friendly.</p>
                </div>
                <div class="col-md-5 ms-auto">
                    <div class="card p-3">
                        <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
                          <li class="nav-item" role="presentation"><button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginTab">Login</button></li>
                          <li class="nav-item" role="presentation"><button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerTab">Register</button></li>
                        </ul>
                        <div class="tab-content">
                          <div class="tab-pane fade show active" id="loginTab">
                            <div class="mb-2"><label class="form-label small">Username</label><input type="text" id="loginUsername" class="form-control" placeholder="Username"></div>
                            <div class="mb-2"><label class="form-label small">Password</label><input type="password" id="loginPassword" class="form-control" placeholder="Password"></div>
                            <button id="loginBtn" class="btn btn-primary w-100">Login</button>
                            <p class="mt-2 small text-muted text-center"><a href="{{ url_for('reset_password') }}">Forgot password?</a></p>
                          </div>
                          <div class="tab-pane fade" id="registerTab">
                            <div class="mb-2"><label class="form-label small">Username</label><input type="text" id="regUsername" class="form-control" placeholder="Username"></div>
                            <div class="mb-2"><label class="form-label small">Email</label><input type="email" id="regEmail" class="form-control" placeholder="Email (optional)"></div>
                            <div class="mb-2"><label class="form-label small">Password</label><input type="password" id="regPassword" class="form-control" placeholder="Password"></div>
                            <button id="registerBtn" class="btn btn-success w-100">Create account</button>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
